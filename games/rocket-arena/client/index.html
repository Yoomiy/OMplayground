<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="512x512" href="/src/assets/generated/rocket-arena-favicon.png" />
  <meta name="theme-color" content="#04070d" />
  <title>רוקט ארנה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04070d;
      font-family: system-ui, "Segoe UI", Arial, "Noto Sans Hebrew", "DejaVu Sans", sans-serif;
    }
    /* Hebrew needs normal word spacing; Latin display tracking hurts readability. */
    html[lang="he"] :is(#hud, #pause-menu) :is(h2, h3, button, span, p, label, output, strong) {
      letter-spacing: normal;
    }
    #app {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

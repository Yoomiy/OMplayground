<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="משחק מרוצי מכשולים תלת־ממדי עם 23 מסלולים ומשחק ברשת." />
    <meta name="theme-color" content="#7FA8FF" />
    <title>Wobble Rush 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" />
    <link
      rel="stylesheet"
      href="/assets/style.css"
      onerror="window.__wobbleBootFailed('לא ניתן להוריד את עיצוב המשחק.')"
    />
    <script>
      // No silent fallbacks: if the module bundle cannot load, say so loudly.
      window.__wobbleBootFailed = (reason) => {
        var root = document.getElementById("app") || document.body
        root.innerHTML =
          '<div dir="rtl" id="boot-error" style="position:fixed;inset:0;display:grid;place-items:center;padding:32px;font:16px/1.6 system-ui,sans-serif;background:#fff2f2;color:#2a2440;text-align:center">' +
          '<div><h1 style="margin:0 0 8px">לא ניתן לטעון את המשחק</h1><p style="margin:0 0 16px">' +
          reason +
          '</p><button type="button" onclick="location.reload()" style="padding:12px 22px;font:inherit;font-weight:700;border:3px solid #2a2440;border-radius:14px;background:#ffd25e;cursor:pointer">טעינה מחדש</button></div></div>'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p dir="rtl" style="font: 16px system-ui; padding: 24px">יש להפעיל JavaScript כדי לשחק.</p>
    </noscript>
    <script
      type="module"
      src="/assets/main.js"
      onerror="window.__wobbleBootFailed('לא ניתן להוריד את קובצי המשחק.')"
    ></script>
  </body>
</html>

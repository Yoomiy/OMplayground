name: Voxel runtime
on:
  push:
  pull_request:
    paths: ['games/voxel/**', 'apps/voxel-server/**', 'apps/web/**', 'packages/game-logic/src/recessSchedule.ts', 'packages/game-logic/package.json', 'packages/game-logic/tsconfig.json', 'packages/observability/**', 'supabase/migrations/*voxel*', 'package.json', 'package-lock.json', '.github/workflows/voxel.yml']
  workflow_dispatch:
    inputs:
      resilience_soak:
        description: Run the 60-minute two-player resilience soak
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: games/voxel/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - run: npm ci --prefix games/voxel
      - run: npm ci --workspace @playground/voxel-server --workspace @playground/game-logic --workspace @playground/observability --workspace @playground/web --include-workspace-root=true --ignore-scripts
      - run: npm run check:voxel
      - run: npm --prefix games/voxel run verify:release
      - run: npm --prefix games/voxel run test:release
      - name: Packaged survival, autosave and crash recovery
        run: |
          npm --prefix games/voxel run benchmark:survival:workers
          npm --prefix games/voxel run check:survival:workers
        env:
          VOXEL_SURVIVAL_SECONDS: '30'
          VOXEL_SURVIVAL_ROOMS: '2'
          VOXEL_SURVIVAL_PLAYERS: '2'
      - run: npm run typecheck --workspace @playground/voxel-server
      - run: npm test --workspace @playground/observability -- --runInBand processLifecycle
      - run: npm test --workspace @playground/voxel-server
      - run: npm run test:integration --workspace @playground/voxel-server
      - run: npm run test:postgres --workspace @playground/voxel-server
        env:
          VOXEL_TEST_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run lint --workspace @playground/web
      - run: npm test --workspace @playground/web
        env:
          VITE_SUPABASE_URL: https://school.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      - run: npm run build --workspace @playground/web
        env:
          VITE_SUPABASE_URL: https://school.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
          VITE_VOXEL_RUNTIME_SERVER_URL: https://voxel.invalid
      - run: npm --prefix games/voxel exec -- playwright install --with-deps chromium
      - name: Install native desktop input tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool xauth
      - name: React school journey with native desktop input
        run: xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' env VOXEL_XDOTOOL=/usr/bin/xdotool npm run test:voxel:browser --workspace @playground/web
        env:
          VOXEL_TEST_POSTGRES: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: npm run test:browser --workspace @playground/voxel-server
      - run: npm run test:browser:lifecycle --workspace @playground/voxel-server
      - run: npm run test:voxel:browser
      - run: npm run test:voxel:creative
      - run: npm --prefix games/voxel run test:edited:browser
      - run: npm --prefix games/voxel run test:input-stalls:browser
      - run: npm --prefix games/voxel run test:network:browser
      - name: Optional existing touch controls
        continue-on-error: true
        run: npm run test:voxel:touch
      - run: npm run test:voxel:environment
      - run: npm run test:voxel:presentation
      - run: npm --prefix games/voxel run test:memory:probe
      - run: |
          npm --prefix games/voxel run test:memory:browser
          npm --prefix games/voxel run check:memory:browser
        env:
          VOXEL_MEMORY_CYCLES: '2'
      - run: npm run test:voxel:recovery
      - run: npm run test:voxel:inventory
      - run: npm --prefix games/voxel run test:held:browser
      - name: PC survival over a delayed connection
        run: xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' env VOXEL_XDOTOOL=/usr/bin/xdotool npm --prefix games/voxel run test:survival:desktop:browser
      - run: npm run test:voxel:tnt
      - run: npm run test:voxel:equipment
      - run: npm run test:voxel:combat
      - run: npm --prefix games/voxel run benchmark:engine
      - name: Assemble matched production runtime
        run: npm run package:voxel-server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-runtime-evidence
          path: |
            games/voxel/test-results/
            apps/voxel-server/test-results/
            apps/web/test-results/
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Build voxel service image from clean checkout
        run: docker build -f apps/voxel-server/Dockerfile -t playground-voxel .
      - name: Verify image startup and graceful drain with fixture providers
        run: |
          mkdir -p apps/voxel-server/test-results
          node apps/voxel-server/tools/smoke-package.mjs --container playground-voxel > apps/voxel-server/test-results/container-package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-image-evidence
          path: apps/voxel-server/test-results/container-package.json

  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm ci --prefix games/voxel --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm --prefix games/voxel run restore:release
      - run: npm --prefix games/voxel run test:resilience
      - name: Packaged authority, persistence and recovery boundaries
        run: >-
          node --test --test-concurrency=2
          games/voxel/tests/integration/admission.test.ts
          games/voxel/tests/integration/durability.test.ts
          games/voxel/tests/integration/lifecycle.test.ts
          games/voxel/tests/integration/logging.test.ts
          games/voxel/tests/integration/session-projection.test.ts
          games/voxel/tests/integration/worker-checkpoint.test.ts
        env:
          VOXEL_TEST_BUNDLE: '1'
      - run: npm --prefix apps/voxel-server run build:shared
      - run: npm --prefix apps/voxel-server run typecheck
      - run: npm --prefix apps/web run lint
      - run: node --test apps/voxel-server/tests/school-session.test.ts apps/voxel-server/tests/service-events.test.ts
      - run: npm --prefix apps/web test -- src/game/voxel/voice-session.test.ts src/game/voxel/world-audio.test.ts src/game/voxel/session-api.test.ts
      - run: npm --prefix games/voxel exec -- playwright install --with-deps chromium
      - run: npm --prefix games/voxel run test:input-stalls:browser
        env:
          VOXEL_TEST_PACKAGE: '1'
      - run: npm --prefix games/voxel run test:feedback:browser
      - run: npm --prefix games/voxel run test:resilience:browser
        env:
          VOXEL_TEST_PACKAGE: '1'
      - run: npm --prefix apps/web run test:voxel:resilience
      - if: github.event_name == 'workflow_dispatch' && inputs.resilience_soak
        run: npm --prefix games/voxel run test:resilience:soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voxel-resilience
          path: |
            games/voxel/test-results/browser-input-stalls.json
            games/voxel/test-results/browser-feedback.json
            games/voxel/test-results/browser-resilience.json
            apps/web/test-results/voxel-resilience-browser.json

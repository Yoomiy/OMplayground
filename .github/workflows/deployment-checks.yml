name: Deployment checks
on:
  push:
permissions:
  actions: read
  statuses: write
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      # This action reports this job's final result in its post step. Keep this
      # workflow to one job: v1 resolves the first job in the workflow run.
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - o-mplayground-game-server: checks'
      - name: Wait for all required workflows on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['voxel.yml', 'classroom.yml'];
            const deadline = Date.now() + 90 * 60 * 1000;
            while (Date.now() < deadline) {
              let complete = true;
              for (const workflow_id of workflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  ...context.repo,
                  workflow_id,
                  head_sha: context.sha,
                  event: 'push',
                  per_page: 20,
                });
                const run = data.workflow_runs
                  .filter(run => run.head_sha === context.sha && run.head_branch === context.ref.replace('refs/heads/', ''))
                  .sort((a, b) => b.id - a.id)[0];
                if (!run || run.status !== 'completed') {
                  complete = false;
                  continue;
                }
                if (run.conclusion !== 'success') {
                  throw new Error(`${workflow_id}: ${run.conclusion}. ${run.html_url}`);
                }
              }
              if (complete) {
                core.info(`All required workflows passed for ${context.sha}`);
                return;
              }
              core.info('Waiting for voxel and classroom checks…');
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Required workflows did not complete within 90 minutes');
      - name: Reject canceled checks
        if: cancelled()
        run: exit 1
